server {
    listen 8080;
    server_name _;
    root /var/www/html/public;

    # Don't include the internal port (e.g., 8080) when nginx builds absolute redirects.
    port_in_redirect off;

    index index.php index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Avoid nginx issuing absolute redirects for /index.php — let the front controller handle requests.
    # Requests are handled by the main `location /` block which passes to index.php when needed.

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}
